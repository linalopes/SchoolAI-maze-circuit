<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinocchio Nose Controller</title>
  <style>
    :root {
      --bg: #22113e;
      --panel: #cad8d8;
      --pink: #ea7dff;
      --turquoise: #08f2db;
      --ink: #16091f;
      --wood: #d98b45;
      --wood-dark: #8a4d25;
      --skin: #f2b37e;
      --skin-shadow: #d88958;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(234, 125, 255, 0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(8, 242, 219, 0.18), transparent 32%),
        var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--panel);
      overflow: hidden;
    }

    .app {
      width: min(920px, 94vw);
      padding: 28px;
      border: 1px solid rgba(202, 216, 216, 0.3);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 36px;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", Inter, system-ui, sans-serif;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      color: white;
    }

    .instructions {
      max-width: 280px;
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.45;
      color: rgba(202, 216, 216, 0.84);
    }

    .key {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      height: 32px;
      padding: 0 10px;
      margin: 0 4px;
      border: 1px solid rgba(8, 242, 219, 0.75);
      border-radius: 9px;
      color: var(--turquoise);
      background: rgba(8, 242, 219, 0.08);
      font-weight: 800;
    }

    .stage {
      position: relative;
      height: min(520px, 62vh);
      min-height: 360px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(202, 216, 216, 0.95), rgba(202, 216, 216, 0.72)),
        var(--panel);
      overflow: hidden;
    }

    .floor {
      position: absolute;
      inset: auto 0 0;
      height: 120px;
      background: repeating-linear-gradient(
        90deg,
        rgba(34, 17, 62, 0.16) 0 2px,
        transparent 2px 78px
      );
      border-top: 3px solid rgba(34, 17, 62, 0.18);
    }

    .character {
      position: absolute;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      width: 220px;
      height: 320px;
    }

    .hat {
      position: absolute;
      left: 63px;
      top: 18px;
      width: 96px;
      height: 74px;
      background: var(--wood-dark);
      clip-path: polygon(50% 0%, 100% 80%, 0% 80%);
      z-index: 5;
    }

    .hat::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 45px;
      width: 48px;
      height: 8px;
      border-radius: 99px;
      background: var(--pink);
    }

    .face {
      position: absolute;
      left: 42px;
      top: 70px;
      width: 136px;
      height: 150px;
      border-radius: 48% 48% 52% 52%;
      background: var(--skin);
      border: 4px solid var(--ink);
      z-index: 3;
    }

    .ear {
      position: absolute;
      top: 122px;
      width: 34px;
      height: 48px;
      border-radius: 50%;
      background: var(--skin-shadow);
      border: 4px solid var(--ink);
      z-index: 2;
    }

    .ear.left { left: 26px; }
    .ear.right { right: 26px; }

    .eye {
      position: absolute;
      top: 52px;
      width: 15px;
      height: 21px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 39px; }
    .eye.right { right: 39px; }

    .cheek {
      position: absolute;
      top: 92px;
      width: 24px;
      height: 13px;
      border-radius: 50%;
      background: rgba(234, 125, 255, 0.48);
    }

    .cheek.left { left: 20px; }
    .cheek.right { right: 20px; }

    .mouth {
      position: absolute;
      left: 50%;
      top: 106px;
      width: 42px;
      height: 20px;
      border-bottom: 4px solid var(--ink);
      border-radius: 0 0 50px 50px;
      transform: translateX(-50%);
    }

    .nose-origin {
      position: absolute;
      left: 110px;
      top: 143px;
      z-index: 6;
    }

    .nose {
      position: absolute;
      left: 0;
      top: -10px;
      width: 80px;
      height: 22px;
      transform-origin: left center;
      border: 4px solid var(--ink);
      border-left: 0;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(90deg, var(--wood), #f0b66a);
      transition: width 90ms linear;
    }

    .nose::after {
      content: "";
      position: absolute;
      right: -13px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%) rotate(45deg);
      border-top: 4px solid var(--ink);
      border-right: 4px solid var(--ink);
      background: #f0b66a;
      border-radius: 2px 8px 2px 2px;
    }

    .body {
      position: absolute;
      left: 64px;
      top: 218px;
      width: 92px;
      height: 96px;
      border-radius: 22px 22px 14px 14px;
      background: var(--pink);
      border: 4px solid var(--ink);
      z-index: 2;
    }

    .collar {
      position: absolute;
      top: -4px;
      width: 100%;
      height: 28px;
      display: flex;
      justify-content: center;
      gap: 2px;
    }

    .collar span {
      width: 28px;
      height: 28px;
      background: white;
      border: 3px solid var(--ink);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .arm,
    .leg {
      position: absolute;
      background: var(--wood);
      border: 4px solid var(--ink);
      border-radius: 99px;
      z-index: 1;
    }

    .arm {
      top: 236px;
      width: 34px;
      height: 88px;
    }

    .arm.left {
      left: 36px;
      transform: rotate(18deg);
    }

    .arm.right {
      right: 36px;
      transform: rotate(-18deg);
    }

    .leg {
      top: 300px;
      width: 34px;
      height: 82px;
    }

    .leg.left { left: 72px; }
    .leg.right { right: 72px; }

    .status {
      position: absolute;
      left: 24px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 0 0 rgba(234, 125, 255, 0.7);
    }

    body.growing .dot {
      background: var(--turquoise);
      animation: pulse 800ms infinite;
    }

    body.growing .stage {
      box-shadow: inset 0 0 0 4px rgba(8, 242, 219, 0.44);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(8, 242, 219, 0.7); }
      100% { box-shadow: 0 0 0 16px rgba(8, 242, 219, 0); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Pinocchio<br />Nose Control</h1>
      <p class="instructions">
        Hold the <span class="key">→</span> right arrow key to grow the nose. Release the key to stop the growth.
      </p>
    </header>

    <section class="stage" aria-label="Interactive Pinocchio scene">
      <div class="character" aria-hidden="true">
        <div class="hat"></div>
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
        <div class="nose-origin">
          <div class="nose" id="nose"></div>
        </div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="body">
          <div class="collar"><span></span><span></span></div>
        </div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="floor"></div>
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">Waiting for right arrow</span>
      </div>
    </section>
  </main>

  <script>
    const nose = document.getElementById("nose");
    const statusText = document.getElementById("statusText");

    let isGrowing = false;
    let noseLength = 80;
    const minLength = 80;
    const maxLength = 430;
    const growthSpeed = 160; // pixels per second
    let lastTime = null;

    function updateNose(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }

      const deltaSeconds = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (isGrowing) {
        noseLength = Math.min(maxLength, noseLength + growthSpeed * deltaSeconds);
        nose.style.width = `${noseLength}px`;
      }

      requestAnimationFrame(updateNose);
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        isGrowing = true;
        document.body.classList.add("growing");
        statusText.textContent = "Nose is growing";
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowRight") {
        isGrowing = false;
        document.body.classList.remove("growing");
        statusText.textContent = "Growth stopped";
      }
    });

    // Optional reset: press R to return the nose to its original size.
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "r") {
        noseLength = minLength;
        nose.style.width = `${noseLength}px`;
        statusText.textContent = "Nose reset";
      }
    });

    requestAnimationFrame(updateNose);
  </script>
</body>
</html>
